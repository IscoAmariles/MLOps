# Configuración de Prometheus (paso 7.2).
# La API corre en el host y Prometheus dentro de Docker, por eso el target es
# host.docker.internal y no localhost.
global:
  scrape_interval: 5s      # corto para que la demo muestre cambios rápido
  evaluation_interval: 5s

scrape_configs:
  - job_name: green-data-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
